name: scan
on:
  repository_dispatch:
    types: [scan]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: scan
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: data
          path: data_branch
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: look back for missed signals (read-only)
        run: python scan.py data_branch ${{ github.event.client_payload.since || '' }}
      - name: save result
        run: |
          cd data_branch
          git config user.name tradebot
          git config user.email tradebot@users.noreply.github.com
          git add scan_result.json
          git commit -qm "scan $(date -u +%FT%TZ)" || echo "nothing changed"
          git push
