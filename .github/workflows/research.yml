name: research
on:
  repository_dispatch:
    types: [research]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: research
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: research branch (history cache + reports)
        run: |
          if git fetch origin research 2>/dev/null; then git worktree add research_branch origin/research; cd research_branch; git checkout -q -B research; else mkdir research_branch && cd research_branch && git init -q && git checkout -q -b research && git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"; fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: download history 2018 →
        env:
          HISTORY_DIR: research_branch/data
          HISTORY_START: "2018-01-01"
        run: python fetch_history.py
      - name: strategy × coin comparison and challenge replay
        env:
          DATA_DIR: research_branch/data
        run: |
          python compare.py XBTUSD ETHUSD SOLUSD LINKUSD XRPUSD ADAUSD AVAXUSD DOTUSD LTCUSD XDGUSD > /dev/null; cp compare_report.md research_branch/compare_report_2018.md
          python attempts.py research_branch/data --out research_branch/attempts_report_2018.md
      - name: save
        run: |
          cd research_branch
          git config user.name tradebot && git config user.email tradebot@users.noreply.github.com
          git add -A && git commit -qm "research $(date -u +%FT%TZ)" || echo "no change"
          git push -u origin research
