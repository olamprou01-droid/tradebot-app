name: tradebot
on:
  schedule:
    - cron: "*/10 * * * *"      # GitHub's own timer (unreliable on new repos — the self-chain below is the primary clock)
  workflow_dispatch:            # "Run workflow" button = run the bot now
  repository_dispatch:
    types: [run]                # API trigger = run the bot now; each run re-triggers the next one (see last step)
permissions:
  contents: write
concurrency:
  group: tradebot
  cancel-in-progress: false
jobs:
  step:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: data
          path: data_branch
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: bot step
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || 'tradebot-eth-7k2m9x' }}
        run: python bot_step.py data_branch
      - name: save state
        run: |
          cd data_branch
          git config user.name tradebot
          git config user.email tradebot@users.noreply.github.com
          git add -A
          git commit -qm "bot $(date -u +%FT%TZ)" || echo "nothing changed"
          for i in 1 2 3; do
            git push && break
            git fetch origin data && git rebase -X theirs origin/data || { git rebase --abort; git reset --hard origin/data; python ../bot_step.py . ; git add -A; git commit -qm "bot retry $(date -u +%FT%TZ)" || true; }
          done
      - name: schedule next run (self-chain; does not depend on GitHub's cron)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          now=$(date +%s); next=$(( (now / 600 + 1) * 600 )); sleep $(( next - now ))
          gh api "repos/${{ github.repository }}/dispatches" -f event_type=run && echo "next run requested"
